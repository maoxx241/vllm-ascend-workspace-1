name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit selected by a maintenance caller
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  local-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            platform: linux
          - os: windows-latest
            python: '3.13'
            platform: win32
          - os: macos-latest
            python: '3.13'
            platform: darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked workspace packages
        run: uv run --no-project python .agents/scripts/vaws_deps.py sync --locked --group dev
      - name: Verify system interpreter handoff
        run: uv run --no-project python .agents/scripts/vaws_deps.py doctor
      - name: Run all local workspace and skill tests
        run: uv run --no-project python -B .agents/scripts/local_tests.py --jobs 2 --timeout 600 --pytest-arg=--durations=20 > workspace-results.json
      - name: Enforce tracked paths
        run: uv run --no-project python -B .agents/scripts/tracked_path_check.py --mode enforce
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-results-${{ matrix.platform }}
          path: |
            workspace-results.json
            .vaws-local/test-runs/
          include-hidden-files: true
