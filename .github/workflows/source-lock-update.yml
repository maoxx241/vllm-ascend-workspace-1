name: Refresh declared source baselines

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-lock-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'vllm-ascend-workspace/vllm-ascend-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_number: ${{ steps.record.outputs.pr_number }}
      pr_head: ${{ steps.record.outputs.pr_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Resolve both declarations from one upstream Ascend commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .agents/scripts/workspace_sources.py refresh
      - name: Validate the source lock contracts
        run: uv run --no-project --with pytest python -m pytest .agents/tests/test_vaws_source_lock.py -q
      - name: Describe the exact source declarations
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.agents/lib').resolve()))
          from vaws_source_lock import load_source_lock, source_update_pr_body
          folder = Path('.vaws-local/source-update')
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'body.md').write_text(source_update_pr_body(load_source_lock(Path('.'))), encoding='utf-8')
          PY
      - name: Create or update the source baseline PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ github.token }}
          branch: codex/update-source-lock
          delete-branch: true
          add-paths: sources.lock.json
          commit-message: 'chore: refresh upstream-declared source baselines'
          title: 'Refresh upstream-declared vLLM and Ascend sources'
          body-path: .vaws-local/source-update/body.md
      - name: Verify the data-only PR and select its exact validation commit
        id: record
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          PR_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        shell: bash
        run: |
          echo "Source baseline PR: ${PR_URL}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p .vaws-local/source-update
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > .vaws-local/source-update/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > .vaws-local/source-update/files.json
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.agents/lib').resolve()))
          from vaws_source_lock import source_update_pr_matches
          folder = Path('.vaws-local/source-update')
          pr = json.loads((folder / 'pr.json').read_text(encoding='utf-8'))
          files = json.loads((folder / 'files.json').read_text(encoding='utf-8'))
          if not source_update_pr_matches(pr, files, os.environ['PR_HEAD']):
              raise SystemExit('Source maintenance PR changed or is not a canonical data-only update')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"pr_number={int(os.environ['PR_NUMBER'])}\npr_head={os.environ['PR_HEAD']}\n")
          PY

  validate:
    needs: refresh
    if: needs.refresh.outputs.pr_head != ''
    uses: ./.github/workflows/skill-catalog.yml
    with:
      checkout_ref: ${{ needs.refresh.outputs.pr_head }}
    permissions:
      contents: read

  merge:
    needs: [refresh, validate]
    if: needs.validate.result == 'success' && vars.VAWS_SOURCE_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: false
      - name: Recheck PR ownership and diff, record tested commit, and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.refresh.outputs.pr_number }}
          PR_HEAD: ${{ needs.refresh.outputs.pr_head }}
        shell: bash
        run: |
          mkdir -p .vaws-local/source-update
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > .vaws-local/source-update/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > .vaws-local/source-update/files.json
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.agents/lib').resolve()))
          from vaws_source_lock import source_update_pr_matches
          folder = Path('.vaws-local/source-update')
          pr = json.loads((folder / 'pr.json').read_text(encoding='utf-8'))
          files = json.loads((folder / 'files.json').read_text(encoding='utf-8'))
          if not source_update_pr_matches(pr, files, os.environ['PR_HEAD']):
              raise SystemExit('PR no longer matches the canonical source-only commit tested by this run')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD}" \
            -f state=success -f context=source-lock/CI \
            -f description='Linux, Windows and macOS local CI passed on this commit' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$PR_HEAD"
          echo "Three-platform local CI passed on ${PR_HEAD}; GitHub accepted the merge request under its branch protection policy." >> "$GITHUB_STEP_SUMMARY"
