<title id="title">VAWS 关键特性</title><desc id="desc">以完成真实任务的总成本为尺度：减少重复准备、手工编排与故障定位成本。按 2026-09-14 锁定实现整理，具体职责、来源和支持边界见配套说明。</desc>
