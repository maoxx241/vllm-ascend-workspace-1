[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "pyyaml>=6",
  "requests>=2",
  "mcp==1.30.0",
  "vaws-remote-dev==0.9.1",
  "vaws-coordinator==0.5.0.dev3",
  "vaws-knowledge[code]==0.7.3",
  "vaws-diagnostics==0.1.3",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
]

[tool.uv]
package = false
default-groups = []

[tool.vaws.environment]
split-knowledge = true

[tool.uv.sources]
vaws-diagnostics = { git = "https://github.com/vllm-ascend-workspace/vaws-diagnostics", rev = "a9135c13bcd3ec88dd3a7c2f454a57f9bee9be14" }
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "a2c69432fa39d54cdfc0f7a9f8842258d7efd697" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "6209646a439b59a26b7a4becdd8994fe75c66f7e" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "927b3774d6ab3809af5bdaec734b427253e0d4dc" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
