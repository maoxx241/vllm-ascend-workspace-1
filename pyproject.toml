[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "pyyaml>=6",
  "requests>=2",
  "mcp==1.30.0",
  "vaws-remote-dev==0.9.3",
  "vaws-coordinator==0.5.0.dev5",
  "vaws-knowledge[code]==0.7.5",
  "vaws-diagnostics==0.2.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
]

[tool.uv]
package = false
default-groups = []

[tool.vaws.environment]
split-knowledge = true

[tool.uv.sources]
vaws-diagnostics = { git = "https://github.com/vllm-ascend-workspace/vaws-diagnostics", rev = "96fcdfaa0f25fa59f12e948eb4e17ead775f3287" }
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "44a728cb02bccb5ba90306eaf8ced2aa385e405d" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "2ca5684d783ad4b2f5bec445aca021ca6972bc57" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "8a5ef8abad99011c16a309133c4fb82b03c9cfbe" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
