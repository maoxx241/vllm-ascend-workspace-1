[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "mcp==1.30.0",
  "vaws-remote-dev==0.8.0",
  "vaws-coordinator==0.4.1.dev2",
  "vaws-knowledge==0.6.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
]

[tool.uv]
package = false

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "a65362882a85b4d460be3e1d15e90de9fb507e70" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "384b89b71078bcad49212d3f6104ccc847485cec" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "485ddc0d71e86915487a1204032426a3d874ba0e" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
