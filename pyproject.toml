[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "pyyaml>=6",
  "requests>=2",
  "mcp==1.30.0",
  "vaws-remote-dev==0.8.0",
  "vaws-coordinator==0.5.0.dev1",
  "vaws-knowledge[code]==0.7.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
]

[tool.uv]
package = false
default-groups = []

[tool.vaws.environment]
split-knowledge = true

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "a65362882a85b4d460be3e1d15e90de9fb507e70" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "0105b2238360cce43cd4e093730d096db079e33f" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "c57e7fb3322c8d83669e5c5f827446462892f113" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
