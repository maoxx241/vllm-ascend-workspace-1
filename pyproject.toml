[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "pyyaml>=6",
  "requests>=2",
  "mcp==1.30.0",
  "vaws-remote-dev==0.9.2",
  "vaws-coordinator==0.5.0.dev4",
  "vaws-knowledge[code]==0.7.4",
  "vaws-diagnostics==0.2.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
]

[tool.uv]
package = false
default-groups = []

[tool.vaws.environment]
split-knowledge = true

[tool.uv.sources]
vaws-diagnostics = { git = "https://github.com/vllm-ascend-workspace/vaws-diagnostics", rev = "ef8477a6c6d78a4a525ce257730759706d30c1f4" }
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "6d7359776d052b7f880a853976b9d82b0e706a65" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "2ea3aef15d8a6112eb9cd7e1c72dd03d3ef3b98d" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "ca5dc10a25a97ca62c259c784967f238a9f79620" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
