[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11",
  "vaws-remote-dev==0.8.0",
  "vaws-coordinator==0.4.1.dev2",
  "vaws-knowledge==0.5.1",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
  "mcp==1.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/maoxx241/remote-dev", rev = "6996e5756d8e81a7842173f34837d649be77b10c" }
vaws-coordinator = { git = "https://github.com/maoxx241/vaws-coordinator", rev = "0d14525b9711f5a38e2036c87e9221982add7a7a" }
vaws-knowledge = { git = "https://github.com/maoxx241/vaws-knowledge", rev = "dac5572b7887e4435fab35fb1a72a38c23d55b33" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
